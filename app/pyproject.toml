[project]
name = "pse-cartographer"
version = "0.3.0"
description = "PSE Cartographer — live J-space cartography of a local GGUF model, on the PSE-A engine (numpy runtime, no PyTorch)"
authors = [{ name = "Andrej Ristic", email = "andrej.s.ristic@gmail.com" }]
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "tokenizers>=0.19",
    "jinja2>=3.1",
    "PySide6-Essentials>=6.5",
    "matplotlib>=3.7",
    "anthropic>=1.0",      # Claude spokesperson (official SDK); other providers use plain HTTPS
]

[project.scripts]
pse-cartographer = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = { find = { include = ["cartographer*", "pse_a*"] } }

[tool.setuptools.package-data]
pse_a = ["data/*.txt", "core/lens/*.txt", "tests/fixtures/*.gguf"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
