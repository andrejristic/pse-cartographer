name: build-exe
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  exe:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/Scripts/pip install -r requirements.txt pyinstaller
      - name: Selftest from source (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/Scripts/python main.py --selftest
      - name: Inno Setup
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then choco install innosetup --no-progress -y; fi
      - name: Build installer
        run: bash packaging/build_exe.sh
      - name: Install silently
        shell: pwsh
        working-directory: app
        run: |
          $setup = Get-ChildItem ..\dist\PSECartographer-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$env:RUNNER_TEMP\cart" -Wait
          if (-not (Test-Path "$env:RUNNER_TEMP\cart\pse-cartographer.exe")) { throw "not installed" }
      - name: Selftest of the installed program
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process "$env:RUNNER_TEMP\cart\pse-cartographer.exe" -ArgumentList '--selftest' -PassThru -Wait -RedirectStandardOutput "$env:RUNNER_TEMP\st.log" -RedirectStandardError "$env:RUNNER_TEMP\ste.log"
          Write-Host "--- selftest stdout:"; Get-Content "$env:RUNNER_TEMP\st.log" -ErrorAction SilentlyContinue
          Write-Host "--- selftest stderr:"; Get-Content "$env:RUNNER_TEMP\ste.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }
      - name: SHA256
        run: cd ../dist && sha256sum *.exe > SHA256SUMS-exe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pse-cartographer-exe
          path: |
            dist/*.exe
            dist/SHA256SUMS-exe.txt
